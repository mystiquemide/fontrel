# Backend for a server: FalkorDB, the Fontrel API, and Caddy for HTTPS.
# Run from the repository root: docker compose -f deploy/docker-compose.yml --env-file .env up -d
services:
  falkordb:
    image: falkordb/falkordb:latest
    restart: unless-stopped
    environment:
      - REDIS_ARGS=--appendonly yes --appendfsync everysec
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
    volumes:
      - ingest-cache:/app/data
    depends_on:
      falkordb:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - API_DOMAIN=${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - api

volumes:
  falkordb-data:
  ingest-cache:
  caddy-data:
